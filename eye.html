<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Eye</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background: #000;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* The digital eye */
    .eye {
        width: 270px;
        height: 270px;

        border-radius: 50%;

        /*
            Permanent blue/white gradient.
            No color changing.
        */
        background:
            radial-gradient(
                circle at 68% 27%,
                #ffffff 0%,
                #dff7ff 12%,
                rgba(170,225,255,.9) 25%,
                transparent 42%
            ),
            linear-gradient(
                145deg,
                #dff8ff 0%,
                #9ddcff 22%,
                #5caeff 45%,
                #2875e8 70%,
                #1748b8 100%
            );

        /*
            Soft blue glow
        */
        box-shadow:
            0 0 12px rgba(80, 170, 255, .45),
            0 0 30px rgba(40, 120, 255, .28),
            0 0 60px rgba(30, 90, 255, .12);

        /*
            Position and blink are controlled here
        */
        transform:
            translate(var(--x, 0px), var(--y, 0px))
            scaleX(var(--sx, 1))
            scaleY(var(--sy, 1));

        transition:
            transform 650ms cubic-bezier(.22, 1, .36, 1);

        animation: glow 4s ease-in-out infinite;
    }


    /*
        Very subtle breathing glow
    */
    @keyframes glow {

        0%, 100% {
            box-shadow:
                0 0 12px rgba(80, 170, 255, .4),
                0 0 30px rgba(40, 120, 255, .25),
                0 0 60px rgba(30, 90, 255, .1);
        }

        50% {
            box-shadow:
                0 0 18px rgba(100, 190, 255, .5),
                0 0 40px rgba(40, 130, 255, .3),
                0 0 75px rgba(30, 90, 255, .15);
        }
    }


    /*
        BLINK

        Instead of an eyelid, the entire circle
        smoothly compresses from both sides.
    */
    .eye.blink {
        --sx: .08;
        --sy: .72;

        transition:
            transform 120ms cubic-bezier(.6, 0, .9, .2);
    }


    /*
        Tiny resting compression
    */
    .eye.thinking {
        --sx: .88;
        --sy: 1.04;
    }
</style>
</head>

<body>

<div class="eye" id="eye"></div>

<script>

const eye = document.getElementById("eye");


// ------------------------------------------------
// MOVE
// ------------------------------------------------

function moveEye() {

    const x = (Math.random() - 0.5) * 100;
    const y = (Math.random() - 0.5) * 70;

    eye.style.setProperty("--x", `${x}px`);
    eye.style.setProperty("--y", `${y}px`);
}


// ------------------------------------------------
// CENTER
// ------------------------------------------------

function centerEye() {

    eye.style.setProperty("--x", "0px");
    eye.style.setProperty("--y", "0px");
}


// ------------------------------------------------
// BLINK
// ------------------------------------------------

function blink() {

    eye.classList.add("blink");

    setTimeout(() => {
        eye.classList.remove("blink");
    }, 170);
}


// ------------------------------------------------
// DOUBLE BLINK
// ------------------------------------------------

function doubleBlink() {

    blink();

    setTimeout(() => {
        blink();
    }, 280);
}


// ------------------------------------------------
// AUTONOMOUS BEHAVIOR
// ------------------------------------------------

function behavior() {

    // Look somewhere
    moveEye();


    // Sometimes blink
    if (Math.random() < .45) {

        setTimeout(() => {
            blink();
        }, 500 + Math.random() * 800);
    }


    // Occasional double blink
    if (Math.random() < .08) {

        setTimeout(() => {
            doubleBlink();
        }, 700);
    }


    // Occasionally return to center
    if (Math.random() < .4) {

        setTimeout(() => {
            centerEye();
        }, 1300 + Math.random() * 1000);
    }


    // Continue
    setTimeout(
        behavior,
        1400 + Math.random() * 2200
    );
}


// Start
behavior();


// ------------------------------------------------
// MICROPHONE REACTION
// ------------------------------------------------

let analyser;
let microphone;
let audioContext;
let micActive = false;


async function startMicrophone() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            return;
        }

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 256;


        microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        micActive = true;

        microphoneLoop();

    } catch (error) {

        // No microphone:
        // autonomous behavior continues.

        console.log("Using autonomous mode.");
    }
}


// ------------------------------------------------
// SOUND REACTION
// ------------------------------------------------

function microphoneLoop() {

    if (!micActive) return;

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    analyser.getByteFrequencyData(data);


    let total = 0;

    for (let i = 0; i < data.length; i++) {
        total += data[i];
    }

    const volume =
        total / data.length;


    /*
        Sound makes the eye move.
    */
    if (volume > 15) {

        const intensity =
            Math.min(volume / 80, 1);

        const x =
            Math.sin(Date.now() / 350)
            * intensity
            * 70;

        const y =
            Math.cos(Date.now() / 500)
            * intensity
            * 45;

        eye.style.setProperty(
            "--x",
            `${x}px`
        );

        eye.style.setProperty(
            "--y",
            `${y}px`
        );
    }


    /*
        Loud sound causes a blink.
    */
    if (
        volume > 65 &&
        Math.random() < .025
    ) {
        blink();
    }


    requestAnimationFrame(
        microphoneLoop
    );
}


startMicrophone();

</script>

</body>
</html>
