<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blue Glow</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .circle {
        width: 260px;
        height: 260px;

        border-radius: 50%;

        background: linear-gradient(
            135deg,
            #001bff,
            #006eff,
            #00bfff,
            #004cff,
            #001bff
        );

        background-size: 300% 300%;

        box-shadow:
            0 0 15px rgba(0, 100, 255, 0.5),
            0 0 35px rgba(0, 100, 255, 0.3);

        animation: gradient 6s ease infinite;
    }

    @keyframes gradient {
        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }
    }
</style>

</head>

<body>

<div class="circle"></div>

</body>
</html>
