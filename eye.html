<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Eye</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background: #000;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    /*
        The digital eye
    */
    .eye {
        width: 230px;
        height: 230px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #8be7ff 0%,
                #0099ff 25%,
                #0055ff 55%,
                #001b75 100%
            );

        --glow: #008cff;

        box-shadow:
            0 0 15px var(--glow),
            0 0 35px var(--glow),
            0 0 70px rgba(0, 120, 255, 0.25);

        /*
            Everything is controlled through transforms,
            making the movement smooth.
        */
        transform:
            translate(var(--moveX, 0px), var(--moveY, 0px))
            scaleX(var(--scaleX, 1))
            scaleY(var(--scaleY, 1));

        transition:
            transform 700ms cubic-bezier(.22, 1, .36, 1),
            background 1200ms ease,
            box-shadow 1200ms ease;

        animation:
            breathing 4s ease-in-out infinite;
    }


    /*
        Gentle idle movement
    */
    @keyframes breathing {

        0%, 100% {
            filter: brightness(1);
        }

        50% {
            filter: brightness(1.12);
        }
    }


    /*
        Blink:
        the circle gets compressed from both sides.
    */
    .eye.blink {
        --scaleX: 0.08;
        --scaleY: 0.72;

        transition:
            transform 120ms cubic-bezier(.5, 0, .8, .2);
    }


    /*
        Quick blink variation
    */
    .eye.fast-blink {
        --scaleX: 0.03;
        --scaleY: 0.6;

        transition:
            transform 80ms ease-in;
    }


    /*
        Status indicator
    */
    #status {
        position: fixed;

        bottom: 25px;
        left: 50%;

        transform: translateX(-50%);

        color: rgba(255,255,255,.35);

        font-family: monospace;
        font-size: 12px;

        letter-spacing: 2px;
        text-transform: uppercase;
    }
</style>
</head>

<body>

<div class="eye" id="eye"></div>

<div id="status">
    DIGITAL EYE
</div>


<script>

const eye = document.getElementById("eye");


// ---------------------------------------------
// COLORS
// ---------------------------------------------

const colors = [
    {
        main: "#006eff",
        light: "#8be7ff",
        dark: "#001b75",
        glow: "#008cff"
    },

    {
        main: "#00d9ff",
        light: "#baffff",
        dark: "#004c75",
        glow: "#00ffff"
    },

    {
        main: "#7b3cff",
        light: "#d8baff",
        dark: "#1d075c",
        glow: "#914cff"
    },

    {
        main: "#ff2f92",
        light: "#ffb8df",
        dark: "#5c0635",
        glow: "#ff3da6"
    },

    {
        main: "#ff3158",
        light: "#ffb0bc",
        dark: "#5c0013",
        glow: "#ff3158"
    },

    {
        main: "#ff8700",
        light: "#ffd29a",
        dark: "#592600",
        glow: "#ff8c1a"
    },

    {
        main: "#00d66b",
        light: "#aaffd1",
        dark: "#003d20",
        glow: "#00ff88"
    },

    {
        main: "#ffe000",
        light: "#fff5a3",
        dark: "#594c00",
        glow: "#ffe600"
    }
];


// ---------------------------------------------
// CHANGE COLOR
// ---------------------------------------------

function changeColor() {

    const c =
        colors[
            Math.floor(Math.random() * colors.length)
        ];

    eye.style.setProperty(
        "--glow",
        c.glow
    );

    eye.style.background = `
        radial-gradient(
            circle at 35% 30%,
            ${c.light} 0%,
            ${c.main} 28%,
            ${c.main} 55%,
            ${c.dark} 100%
        )
    `;
}


// ---------------------------------------------
// MOVE
// ---------------------------------------------

function moveEye() {

    const x =
        (Math.random() - 0.5) * 100;

    const y =
        (Math.random() - 0.5) * 70;

    eye.style.setProperty(
        "--moveX",
        `${x}px`
    );

    eye.style.setProperty(
        "--moveY",
        `${y}px`
    );
}


// ---------------------------------------------
// RESET POSITION
// ---------------------------------------------

function centerEye() {

    eye.style.setProperty(
        "--moveX",
        "0px"
    );

    eye.style.setProperty(
        "--moveY",
        "0px"
    );
}


// ---------------------------------------------
// BLINK
// ---------------------------------------------

function blink() {

    eye.classList.add("blink");

    setTimeout(() => {

        eye.classList.remove("blink");

    }, 180);
}


// ---------------------------------------------
// DOUBLE BLINK
// ---------------------------------------------

function doubleBlink() {

    blink();

    setTimeout(() => {

        blink();

    }, 300);
}


// ---------------------------------------------
// RANDOM BEHAVIOR
// ---------------------------------------------

function randomBehavior() {

    /*
        Look somewhere
    */
    moveEye();


    /*
        Sometimes change color
    */
    if (Math.random() < 0.18) {
        changeColor();
    }


    /*
        Sometimes blink after moving
    */
    if (Math.random() < 0.45) {

        setTimeout(() => {

            blink();

        }, 400 + Math.random() * 900);

    }


    /*
        Occasionally double blink
    */
    if (Math.random() < 0.08) {

        setTimeout(() => {

            doubleBlink();

        }, 700);

    }


    /*
        Return toward center occasionally
    */
    if (Math.random() < 0.3) {

        setTimeout(() => {

            centerEye();

        }, 1200 + Math.random() * 1200);

    }


    /*
        Next behavior
    */
    setTimeout(
        randomBehavior,
        1200 + Math.random() * 2300
    );
}


// ---------------------------------------------
// START
// ---------------------------------------------

changeColor();

randomBehavior();


// ---------------------------------------------
// MICROPHONE REACTIVITY
// ---------------------------------------------

let analyser;
let microphone;
let audioContext;
let micActive = false;


async function startMicrophone() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            return;
        }

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 256;


        microphone =
            audioContext.createMediaStreamSource(
                stream
            );


        microphone.connect(analyser);

        micActive = true;

        microphoneLoop();

    } catch (error) {

        /*
            If microphone isn't available,
            autonomous behavior continues.
        */

        console.log(
            "Microphone unavailable. Using autonomous mode."
        );
    }
}


// ---------------------------------------------
// MICROPHONE LOOP
// ---------------------------------------------

function microphoneLoop() {

    if (!micActive) return;

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    analyser.getByteFrequencyData(data);


    let total = 0;

    for (let i = 0; i < data.length; i++) {
        total += data[i];
    }


    const volume =
        total / data.length;


    /*
        Only react strongly to noticeable sound.
    */
    if (volume > 35) {

        const intensity =
            Math.min(volume / 100, 1);


        /*
            Sound moves the circle.
        */
        const x =
            Math.sin(Date.now() / 250)
            * intensity
            * 90;

        const y =
            Math.cos(Date.now() / 350)
            * intensity
            * 60;


        eye.style.setProperty(
            "--moveX",
            `${x}px`
        );

        eye.style.setProperty(
            "--moveY",
            `${y}px`
        );


        /*
            Loud sound makes it brighter.
        */
        eye.style.filter =
            `brightness(${1 + intensity * .5})`;


        /*
            Very loud sound = blink.
        */
        if (
            volume > 70 &&
            Math.random() < 0.025
        ) {

            blink();
        }


        /*
            Occasionally react with
            a completely different color.
        */
        if (
            volume > 55 &&
            Math.random() < 0.01
        ) {

            changeColor();
        }

    } else {

        eye.style.filter =
            "brightness(1)";
    }


    requestAnimationFrame(
        microphoneLoop
    );
}


startMicrophone();

</script>

</body>
</html>
